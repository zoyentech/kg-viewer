<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeauZenith｜营养健康数字具身智能知识图谱</title>
<style>
  :root {
    --bz-ink: #211b34;
    --bz-midnight: #0b0d1b;
    --bz-night-purple: #322b50;
    --bz-paper: #f4efdf;
    --bz-gold: #bd8b35;
    --bz-gold-soft: rgba(189, 139, 53, 0.34);
    --bz-muted: rgba(244, 239, 223, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bz-midnight); color: var(--bz-paper);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #viewport { position: fixed; inset: 0; }
  #viewport canvas { display: block; }
  .panel { position: fixed; background: rgba(33, 27, 52, 0.82); border: 1px solid var(--bz-gold-soft);
    border-radius: 12px; backdrop-filter: blur(10px); padding: 12px 14px; z-index: 10; }
  #title { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 11px; color: var(--bz-paper); padding: 0; white-space: nowrap; z-index: 10;
    border: none; background: none; border-radius: 0; backdrop-filter: none;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55); }
  #title .brand-mark { width: 40px; height: 45px; flex: none; overflow: visible; }
  #title .brand-mark .brand-arc { fill: none; stroke: var(--bz-paper); stroke-width: 3.5;
    stroke-linecap: round; }
  #title .brand-mark .brand-crossbar { stroke: var(--bz-paper); stroke-width: 3.5; stroke-linecap: round; }
  #title .brand-mark .brand-apex { fill: var(--bz-gold); }
  #title .brand-copy { display: flex; flex-direction: column; align-items: flex-start; }
  #title .brand-name { display: block; font-family: "Avenir Next", "Helvetica Neue", -apple-system, sans-serif;
    font-size: 32px; line-height: 1; font-weight: 500; letter-spacing: 0.8px;
    color: var(--bz-paper); }
  #title .brand-subtitle { display: block; margin-top: 6px; font-size: 14px; line-height: 1.2;
    font-weight: 500; letter-spacing: 2px; color: rgba(244, 239, 223, 0.76); }
  #legend { right: 16px; top: 16px; min-width: 158px; }
  #legend h3 { font-size: 12px; font-weight: 600; color: var(--bz-muted); margin-bottom: 6px; letter-spacing: 1px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-count { margin-left: auto; opacity: .55; font-size: 12px; font-variant-numeric: tabular-nums; }
  #controls { left: 16px; top: 16px; width: 240px; display: flex; flex-direction: column; gap: 9px; }
  #controls .group-title { font-size: 12px; color: var(--bz-muted); letter-spacing: 1px; }
  #controls label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  #controls label input { accent-color: var(--bz-gold); }
  #controls input[type=range] { width: 100%; accent-color: var(--bz-gold); }
  /* 调试用的 4 个滑块:标签/数值一行,滑块另一行 */
  #controls .slider-row { display: flex; flex-direction: column; gap: 2px; cursor: default; }
  #controls .slider-row .slider-label { display: flex; justify-content: space-between; font-size: 12px; }
  #controls .slider-row .slider-val { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  /* dev 布局调试滑块:默认隐藏,?dev=1 或按 D 键显示;display:contents 让子项融入 flex 布局 */
  #controls .dev-only { display: none; }
  #controls .dev-only.visible { display: contents; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; background: rgba(189, 139, 53, 0.14); color: #f0dbb2; border: 1px solid rgba(189, 139, 53, 0.46);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; cursor: pointer; transition: background .15s; }
  button:hover { background: rgba(189, 139, 53, 0.28); }
  #stats { left: 16px; bottom: 16px; font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  #tooltip { position: fixed; pointer-events: none; display: none; z-index: 30; max-width: 280px;
    background: rgba(19, 16, 32, 0.94); border: 1px solid var(--bz-gold-soft); padding: 6px 10px;
    border-radius: 8px; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
 #infoCard.hidden { display: none; }
 #infoCard { left: 16px; top: 50%; transform: translateY(-50%); width: 216px; max-width: 216px; overflow-wrap: break-word; word-break: break-word; }
  #infoName { font-size: 18px; font-weight: 700; }
  #infoType { font-size: 12px; opacity: .72; margin-top: 3px; }
  #infoId { font-size: 11px; opacity: .45; margin-top: 2px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #infoStat { font-size: 12px; opacity: .78; margin-top: 8px; }
  #infoDesc { font-size: 13px; line-height: 1.65; margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(189,139,53,.24); display: none; }
 #infoDesc .desc-loading { opacity: .5; }
 #infoDesc .desc-error { opacity: .55; font-size: 12px; }
 #infoProductType { font-size: 12px; opacity: .82; margin-top: 4px; display: none; }
 #infoProductType .pt-key { opacity: .6; }
 #infoIngredients { display: none; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(189,139,53,.24); }
 #infoIngredients .ing-title { font-size: 12px; opacity: .72; margin-bottom: 6px; letter-spacing: .5px; }
 #infoIngredients .ing-list { max-height: 220px; overflow-y: auto; }
 #infoIngredients .ing-list::-webkit-scrollbar { width: 4px; }
 #infoIngredients .ing-list::-webkit-scrollbar-thumb { background: rgba(120,160,255,.25); border-radius: 2px; }
 #infoIngredients .ing-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; font-size: 12px; line-height: 1.4; }
 #infoIngredients .ing-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 #infoIngredients .ing-amt { flex: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; opacity: .82; font-variant-numeric: tabular-nums; white-space: nowrap; }
 #infoIngredients .ing-amt.none { opacity: .35; }
  #infoAbstract { display: none; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(189,139,53,.24); }
  #infoAbstract .abs-title { font-size: 12px; opacity: .72; margin-bottom: 6px; letter-spacing: .5px; }
  #infoAbstract .abs-body { max-height: 168px; overflow-y: auto; font-size: 12px; line-height: 1.6; padding-right: 6px;
    white-space: pre-wrap; word-break: break-word; }
  #infoAbstract .abs-body::-webkit-scrollbar { width: 5px; }
  #infoAbstract .abs-body::-webkit-scrollbar-thumb { background: rgba(120,160,255,.28); border-radius: 3px; }
  #infoAbstract .abs-empty { opacity: .4; font-size: 12px; }
  #infoEvidence { display: none; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(189,139,53,.24); }
  #infoEvidence .ev-title { font-size: 12px; opacity: .72; margin-bottom: 6px; letter-spacing: .5px; }
  #infoEvidence .ev-row { font-size: 12px; line-height: 1.5; margin: 5px 0; display: flex; align-items: baseline; gap: 6px; }
  #infoEvidence .ev-key { flex: none; opacity: .6; }
  #infoEvidence .ev-value { flex: 1; min-width: 0; word-break: break-word; }
  #infoEvidence .ev-badge { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 600; }
  #infoEvidence .ev-badge.benefit { color: #7ae0c3; background: rgba(122,224,195,.14); border: 1px solid rgba(122,224,195,.4); }
  #infoEvidence .ev-badge.harm { color: #ff9f6b; background: rgba(255,159,107,.14); border: 1px solid rgba(255,159,107,.4); }
  #infoEvidence .ev-badge.neutral { color: rgba(230,236,255,.7); background: rgba(120,160,255,.1); border: 1px solid rgba(120,160,255,.25); }
  #infoEvidence .ev-source { color: #8fd6ff; text-decoration: none; overflow-wrap: anywhere; }
  #infoEvidence .ev-source:hover { text-decoration: underline; }
  #infoEvidence .ev-empty { opacity: .4; }
.help { position: fixed; bottom: 16px; right: 16px; font-size: 11px; opacity: .5; text-align: right; z-index: 10; line-height: 1.7; }
  #searchPanel { left: 50%; top: 70px; transform: translateX(-50%); width: 360px; padding: 8px 10px; }
  .search-row { display: flex; gap: 6px; }
  #searchTypeFilter { flex: none; background: rgba(19,16,32,.72); border: 1px solid rgba(189,139,53,.28);
    border-radius: 8px; padding: 7px 6px; color: var(--bz-paper); font-size: 12px; outline: none;
    font-family: inherit; cursor: pointer; }
  #searchTypeFilter:focus { border-color: rgba(189,139,53,.8); }
  #searchTypeFilter option { background: var(--bz-ink); color: var(--bz-paper); }
  .search-input-wrap { position: relative; flex: 1; min-width: 0; }
  #searchInput { width: 100%; background: rgba(19,16,32,.72); border: 1px solid rgba(189,139,53,.28);
    border-radius: 8px; padding: 7px 10px; color: var(--bz-paper); font-size: 13px; outline: none;
    font-family: inherit; padding-right: 28px; }
  #searchInput:focus { border-color: rgba(189,139,53,.8); }
  #searchInput::placeholder { color: rgba(244,239,223,.38); }
  #searchClear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: none; width: 20px; height: 20px; padding: 0; border: none; border-radius: 50%;
    background: transparent; color: rgba(230,236,255,.4); cursor: pointer;
    align-items: center; justify-content: center; transition: color .15s, background .15s; }
  #searchClear:hover { color: rgba(230,236,255,.9); background: rgba(120,160,255,.15); }
  #searchClear svg { width: 13px; height: 13px; }
  #searchResults { display: none; margin-top: 6px; max-height: 340px; overflow-y: auto; }
  #searchResults::-webkit-scrollbar { width: 4px; }
  #searchResults::-webkit-scrollbar-thumb { background: rgba(120,160,255,.25); border-radius: 2px; }
  .search-result { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 6px; transition: background .12s; }
  .search-result:hover { background: rgba(78,205,196,.14); }
  .search-result .sr-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .search-result .sr-type { margin-left: auto; opacity: .5; font-size: 11px; white-space: nowrap; }
  .legend-item { cursor: pointer; transition: opacity .15s; }
  .legend-item.dimmed { opacity: .35; }
  .legend-item.dimmed .dot { box-shadow: none !important; }
</style>
</head>
<body>
<div id="viewport"></div>

<div id="title" aria-label="BeauZenith 营养健康数字具身智能知识图谱">
  <svg class="brand-mark" viewBox="0 0 48 54" aria-hidden="true">
    <path class="brand-arc" d="M5 48 C10 31 14 13 24 8 C34 13 38 31 43 48" />
    <path class="brand-crossbar" d="M11 32 H37" />
    <circle class="brand-apex" cx="24" cy="8" r="4.8" />
  </svg>
  <span class="brand-copy">
    <span class="brand-name">BeauZenith</span>
    <span class="brand-subtitle">营养健康数字具身智能知识图谱</span>
  </span>
</div>

<div id="searchPanel" class="panel">
  <div class="search-row">
    <select id="searchTypeFilter"></select>
    <div class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="搜索节点名称…" autocomplete="off">
      <button id="searchClear" type="button" aria-label="清除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="searchResults"></div>
</div>

<div id="legend" class="panel">
  <h3>节点类型</h3>
  <div id="legendItems"></div>
</div>

<div id="controls" class="panel">
  <div class="group-title">视图控制</div>
  <label><input type="checkbox" id="toggleRotate" checked> 自动旋转</label>
  <label><input type="checkbox" id="toggleLabels" checked> 显示标签</label>

  <div class="group-title" style="margin-top:6px">视野</div>
  <div class="slider-row">
    <div class="slider-label">视野距离 <span id="cameraRadiusVal" class="slider-val">80</span></div>
    <input type="range" id="cameraRadius" min="10" max="180" step="1" value="80">
  </div>

  <!-- dev 布局调试滑块:默认隐藏。?dev=1 或运行中按 D 键切换显示 -->
  <div id="devControls" class="dev-only">
    <div class="group-title" style="margin-top:6px">层级布局（dev）</div>
    <div class="slider-row">
      <div class="slider-label">层级间距 (Y) <span id="layerSpacingVal" class="slider-val">10.0</span></div>
      <input type="range" id="layerSpacing" min="1" max="15" step="0.5" value="10">
    </div>
    <div class="slider-row">
      <div class="slider-label">配方 环半径 (depth 0) <span id="ringRadius0Val" class="slider-val">10.0</span></div>
      <input type="range" id="ringRadius0" min="1" max="80" step="0.5" value="10">
    </div>
    <div class="slider-row">
      <div class="slider-label">成分 环半径 (depth 1) <span id="ringRadius1Val" class="slider-val">20.0</span></div>
      <input type="range" id="ringRadius1" min="1" max="80" step="0.5" value="20">
    </div>
    <div class="slider-row">
      <div class="slider-label">循证证据 环半径 (depth 2) <span id="ringRadius2Val" class="slider-val">30.0</span></div>
      <input type="range" id="ringRadius2" min="1" max="80" step="0.5" value="30">
    </div>
    <div class="slider-row">
      <div class="slider-label">健康结局 环半径 (depth 3) <span id="ringRadius3Val" class="slider-val">40.0</span></div>
      <input type="range" id="ringRadius3" min="1" max="80" step="0.5" value="40">
    </div>
    <div class="slider-row">
      <div class="slider-label">节点群 Y 偏移（初始加载位置） <span id="graphOffsetYVal" class="slider-val">12.0</span></div>
      <input type="range" id="graphOffsetY" min="-30" max="30" step="0.5" value="12">
    </div>
  </div>

  <div class="row" style="margin-top:4px">
    <button id="resetView">重置视角</button>
    <button id="resetScene">重置画面</button>
  </div>
</div>

<div id="stats" class="panel"></div>
<div id="status" class="panel" style="display:none; left:50%; bottom:16px; transform:translateX(-50%); font-size:12px; max-width:70%; text-align:center;"></div>
<div id="infoCard" class="panel hidden">
  <div id="infoName"></div>
  <div id="infoType"></div>
  <div id="infoProductType"></div>
  <div id="infoId"></div>
  <div id="infoStat"></div>
  <div id="infoIngredients"></div>
  <div id="infoAbstract"></div>
  <div id="infoEvidence"></div>
<div id="infoDesc"></div>
</div>
<div id="tooltip"></div>
<div class="help">拖拽 JSON 文件到窗口可加载自定义图谱<br>滚轮缩放 · 拖拽旋转 · 点击节点聚焦 · Esc 取消</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = sel => document.querySelector(sel);

const SAMPLE = {
  // 后端不可用时的兜底：和 /v1/graph/kg 一致，只画 4 类主节点。
  types: {
    product:     { label: '配方',   color: '#ff6b6b' },
    ingredient:  { label: '成分',   color: '#4ecdc4' },
    healthtopic: { label: '健康结局', color: '#a78bfa' },
    evidence:    { label: '循证证据', color: '#96ceb4' }
  },
 nodes: [
    { id: 'p1', label: '复合维生素 B 群', type: 'product', properties: { product_type: '复合维生素（B 族）' } },
    { id: 'p2', label: 'Omega-3 鱼油',    type: 'product', properties: { product_type: '鱼油（Omega-3）' } },
    { id: 'p3', label: '钙镁锌片',        type: 'product', properties: { product_type: '矿物质（钙镁锌）' } },
   { id: 'i1', label: '维生素 B6',  type: 'ingredient' },
    { id: 'i2', label: '维生素 B12', type: 'ingredient' },
    { id: 'i3', label: 'EPA',        type: 'ingredient' },
    { id: 'i4', label: 'DHA',        type: 'ingredient' },
    { id: 'i5', label: '钙',         type: 'ingredient' },
    { id: 'i6', label: '镁',         type: 'ingredient' },
    { id: 't1', label: '心血管健康', type: 'healthtopic' },
    { id: 't2', label: '骨骼健康',   type: 'healthtopic' },
    { id: 't3', label: '能量代谢',   type: 'healthtopic' },
    { id: 'e1', label: 'B 群降低同型半胱氨酸 RCT', type: 'evidence' },
    { id: 'e2', label: 'Omega-3 对血脂的 Meta 分析', type: 'evidence' },
    { id: 'e3', label: '钙镁协同的骨密度队列',     type: 'evidence' }
  ],
 links: [
   // Product - Ingredient (产品含成分)
    // 第三个元素为「声明成分」关系的 amount(含量)，演示剂量信息
    ['p1','i1','1.7 mg'], ['p1','i2','2.4 mcg'], ['p2','i3','180 mg'], ['p2','i4','120 mg'], ['p3','i5','200 mg'], ['p3','i6','50 mg'],
   // Ingredient - Evidence (成分→论文, EVIDENCE_FOR)
   ['i1','e1'], ['i2','e1'], ['i3','e2'], ['i4','e2'], ['i5','e3'], ['i6','e3'],
   // Evidence - HealthTopic (论文→健康结局, SUPPORTS_TOPIC)
   ['e1','t1'], ['e1','t3'], ['e2','t1'], ['e3','t2']
  ].map(([source, target, amount]) => ({ source, target, ...(amount ? { properties: { amount } } : {}) }))
};

// 顶到底层级顺序（用户指定，2026-08-05）。
// EvidenceContext 经两跳穿透后不再出现；Evidence 借助 EvidenceContext 桥接到
// Ingredient 和 HealthTopic，因此 Evidence 居中于二者之间，形成 4 层链路：
//   Product 配方 → Ingredient 成分 → Evidence 循证证据 → HealthTopic 健康结局
// 任何不在表里的 type 会自动放到下一层（不挤占固定位置）。
const TYPE_DEPTHS = {
  Product: 0,
  Ingredient: 1,
  Evidence: 2,
  HealthTopic: 3,
};

// 4 个固定 type 的稳定配色，避免 Neo4j 标签 hash 出近似色挤一起。
const TYPE_COLORS = {
  Product:     '#ff6b6b', // 红
  Ingredient:  '#4ecdc4', // 青
  HealthTopic: '#a78bfa', // 紫
  Evidence:    '#96ceb4', // 鼠尾草
};

// 主体节点按图例固定拆成 4 个材质层；未知类型仍由 buildGraph 追加兜底层。
// 每个层只有一个 InstancedMesh，避免回退到每节点一个 Mesh 的高 draw-call 路径。
const NODE_LAYER_TYPES = ['Product', 'Ingredient', 'Evidence', 'HealthTopic'];

// 每层球体大小：节点多 → 球小一点，避免同环上互相盖住
const LAYER_SIZES = {
  0: 1.0,   // Product
  1: 0.65,  // Ingredient 节点多
  2: 0.60,  // Evidence 节点最多, 最小
  3: 0.80,  // HealthTopic 节点少, 大一些
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
$('#viewport').appendChild(renderer.domElement);

function configureRenderQuality(nodeCount) {
  const pixelRatioCap = nodeCount > 1800 ? 1.5 : 2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, pixelRatioCap));
  if (haloPoints && haloPoints.material.uniforms.uPixelRatio) {
    haloPoints.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f1e);
scene.fog = new THREE.Fog(0x0a0f1e, 80, 170);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
// 视角由「方向 + 距离」决定:方向沿用原俯仰角,距离由 INIT_CAMERA_RADIUS(视野距离)控制。
// 这样「视野距离」滑块和「重置视角」共享同一基准,改距离不破坏视角朝向。
const INIT_TARGET = new THREE.Vector3(0, -12, 0);
const INIT_CAMERA_RADIUS = 80;                         // 视野距离默认值(=滑块默认)
const INIT_DIR = new THREE.Vector3(34, 28, 50).normalize(); // 原 (34,16,50)-(0,-12,0) 方向,单位化
const INIT_POS = INIT_TARGET.clone().add(INIT_DIR.clone().multiplyScalar(INIT_CAMERA_RADIUS));
camera.position.copy(INIT_POS);
// 调试用辅助:把整个图(节点/连线/标签/环)整体沿 Y 平移
function applyGraphOffsetY(v) {
  nodeGroup.position.y = v;
  linkGroup.position.y = v;
  ringGroup.position.y = v;
  labelGroup.position.y = v;
}


const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.copy(INIT_TARGET);

function typeColor(type, types) {
  // 1) 用户给 5 种 Neo4j 标签分配的固定色
  if (TYPE_COLORS[type]) return new THREE.Color(TYPE_COLORS[type]);
  // 2) 数据里自定义 types（载入 JSON 时用）
  const t = types[type];
  if (t && t.color) return new THREE.Color(t.color);
  // 3) 兜底 hash 色
  const palette = ['#8d99ae', '#ef476f', '#06d6a0', '#118ab2', '#ffd166', '#b5838d'];
  let h = 0;
  for (const ch of String(type)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return new THREE.Color(palette[h % palette.length]);
}
function typeLabel(type, types) {
  if (TYPE_LABELS_CN[type]) return TYPE_LABELS_CN[type];
  const t = types[type];
  return t ? t.label : String(type);
}

const nodeInstanceMatrix = new THREE.Matrix4();
const nodeInstanceScale = new THREE.Vector3();
const nodeInstanceQuaternion = new THREE.Quaternion();
const nodeFocusColor = new THREE.Color(0xffffff);

// 将常见的质量单位统一为 mg。范围值取首尾平均值，无法解析时返回 null，
// 这样缺失 amount 的关系不会被误当成 0 mg 参与比例竞争。
function parseAmountMg(value) {
  if (value == null || String(value).trim() === '') return null;
  const raw = String(value).replace(/,/g, '').trim();
  const numbers = raw.match(/[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/gi);
  if (!numbers || !numbers.length) return null;
  const parsed = numbers.slice(0, 2).map(Number).filter(Number.isFinite);
  if (!parsed.length) return null;
  const amount = parsed.length > 1 ? (parsed[0] + parsed[1]) / 2 : parsed[0];
  const lower = raw.toLowerCase();
  const unit = lower.match(/千克|公斤|kg|毫克|mg|微克|mcg|μg|ug|克|g/);
  if (!unit) return amount;
  switch (unit[0]) {
    case '千克': case '公斤': case 'kg': return amount * 1000000;
    case '克': case 'g': return amount * 1000;
    case '微克': case 'mcg': case 'μg': case 'ug': return amount / 1000;
    default: return amount;
  }
}

function amountVisualFactor(share, maxShare) {
  const normalized = share > 0 && maxShare > 0
    ? Math.min(1, Math.sqrt(share / maxShare))
    : 0;
  return 0.72 + normalized * 1.35;
}

function colorsEqual(a, b) {
  return a && b && a.r === b.r && a.g === b.g && a.b === b.b;
}

function makeNodeLayerMaterial(type) {
  const material = new THREE.MeshStandardMaterial({
    // InstancedMesh.instanceColor stores the full legend/amount color. A
    // white base keeps that color intact under Three.js's standard instance
    // color path instead of multiplying it into a muddy brown.
    color: 0xffffff,
    roughness: 0.28,
    metalness: 0.12,
    emissive: 0x222222,
    emissiveIntensity: 1,
  });
  material.userData.nodeType = type;
  material.userData.legendColor = TYPE_COLORS[type] || null;
  return material;
}

function syncNodeInstance(n, scale, visible, focused, force = false) {
  if (!n.nodeLayerMesh || !hitboxInstances) return false;
  const nextScale = Math.max(Number(scale) || 0, 0.0001);
  const nextColor = focused ? nodeFocusColor : n.renderColor;
  const colorChanged = !colorsEqual(n.instanceColor, nextColor);
  const changed = force || n.instanceScale !== nextScale ||
    n.instanceVisible !== visible || n.instanceFocused !== focused || colorChanged;
  n.instanceVisible = visible;
  if (!changed) return false;

  nodeInstanceScale.setScalar(nextScale);
  nodeInstanceMatrix.compose(n.position, nodeInstanceQuaternion, nodeInstanceScale);
  const nodeLayerMesh = n.nodeLayerMesh;
  nodeLayerMesh.setMatrixAt(n.nodeLayerIndex, nodeInstanceMatrix);
  nodeLayerMesh.setColorAt(n.nodeLayerIndex, nextColor);

  const hitboxScale = visible ? n.hitboxScale : 0.0001;
  nodeInstanceScale.setScalar(hitboxScale);
  nodeInstanceMatrix.compose(n.position, nodeInstanceQuaternion, nodeInstanceScale);
  hitboxInstances.setMatrixAt(n.instanceIndex, nodeInstanceMatrix);

  n.instanceScale = nextScale;
  n.instanceFocused = focused;
  n.instanceColor.copy(nextColor);
  nodeVisualsDirty = true;
  if (haloPoints) {
    const haloIndex = n.instanceIndex;
    const haloSize = haloPoints.geometry.getAttribute('haloSize');
    const haloColor = haloPoints.geometry.getAttribute('haloColor');
    const nextHaloSize = visible ? n.renderScale * (focused ? 3.9 : 3.4) : 0;
    if (haloSize.array[haloIndex] !== nextHaloSize) {
      haloSize.array[haloIndex] = nextHaloSize;
      haloVisualsDirty = true;
    }
    const colorOffset = haloIndex * 3;
    if (haloColor.array[colorOffset] !== nextColor.r || haloColor.array[colorOffset + 1] !== nextColor.g || haloColor.array[colorOffset + 2] !== nextColor.b) {
      haloColor.array[colorOffset] = nextColor.r;
      haloColor.array[colorOffset + 1] = nextColor.g;
      haloColor.array[colorOffset + 2] = nextColor.b;
      haloVisualsDirty = true;
    }
  }
  return true;
}

function syncNodeBuffers() {
  if (nodeVisualsDirty) {
    for (const nodeLayerMesh of nodeLayerMeshes) {
      nodeLayerMesh.instanceMatrix.needsUpdate = true;
      if (nodeLayerMesh.instanceColor) nodeLayerMesh.instanceColor.needsUpdate = true;
    }
  }
  if (nodeVisualsDirty && hitboxInstances) hitboxInstances.instanceMatrix.needsUpdate = true;
  if (haloVisualsDirty && haloPoints) {
    for (const name of ['haloSize', 'haloColor']) {
      const attribute = haloPoints.geometry.getAttribute(name);
      if (attribute) attribute.needsUpdate = true;
    }
  }
  nodeVisualsDirty = false;
  haloVisualsDirty = false;
}

function applyRecipeAmountVisuals(productId) {
  let activeProduct = productId ? nodeMap.get(productId) : null;
  if (!activeProduct || String(activeProduct.type).toLowerCase() !== 'product') activeProduct = null;
  for (const n of nodeMap.values()) {
    n.amountShare = 0;
    n.renderScale = n.baseSize;
    n.renderColor.copy(n.baseColor);
  }
  if (!activeProduct) {
    nodeVisualsDirty = true;
    haloVisualsDirty = true;
    labelLodDirty = true;
    return;
  }

  const amounts = [];
  for (const link of linkRecords) {
    if (link.a !== activeProduct || String(link.b.type).toLowerCase() !== 'ingredient') continue;
    const amount = parseAmountMg(link.props && link.props.amount);
    if (amount != null && amount > 0) amounts.push({ node: link.b, amount });
  }
  const total = amounts.reduce((sum, entry) => sum + entry.amount, 0);
  const maxAmount = amounts.reduce((max, entry) => Math.max(max, entry.amount), 0);
  if (total > 0 && maxAmount > 0) {
    for (const { node, amount } of amounts) {
      const share = amount / total;
      node.amountShare = share;
      node.renderScale = node.baseSize * amountVisualFactor(share, maxAmount / total);
      node.renderColor.copy(node.baseColor).lerp(nodeFocusColor, 0.2 + 0.55 * Math.sqrt(share / (maxAmount / total)));
    }
  }
  nodeVisualsDirty = true;
  haloVisualsDirty = true;
  labelLodDirty = true;
}

function disposeGroup(g) {
  const geometries = new Set();
  const materials = new Set();
  while (g.children.length) {
    const c = g.children.pop();
    if (c.geometry && !geometries.has(c.geometry)) {
      geometries.add(c.geometry);
      c.geometry.dispose();
    }
    const mats = Array.isArray(c.material) ? c.material : [c.material];
    for (const m of mats) {
      if (!m || materials.has(m)) continue;
      materials.add(m);
      if (m.map) m.map.dispose();
      m.dispose();
    }
  }
}

function makeLabelSprite(text, colorHex) {
  const font = '600 42px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d');
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  const pad = 26;
  cvs.width = Math.ceil(tw + pad * 2);
  cvs.height = 88;
  const ctx2 = cvs.getContext('2d');
  ctx2.font = font;
  ctx2.textAlign = 'center';
  ctx2.textBaseline = 'middle';
  ctx2.lineWidth = 10;
  ctx2.lineJoin = 'round';
  ctx2.strokeStyle = 'rgba(4, 8, 18, 0.92)';
  ctx2.strokeText(text, cvs.width / 2, 46);
  ctx2.fillStyle = colorHex;
  ctx2.fillText(text, cvs.width / 2, 46);
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const k = 0.115;
  sp.scale.set((tw + pad * 2) / 42 * k, 88 / 42 * k, 1);
  return sp;
}

function makeHaloMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) } },
    vertexShader: `
      attribute vec3 haloColor;
      attribute float haloSize;
      attribute float haloPhase;
      varying vec3 vHaloColor;
      varying float vHaloVisible;
      uniform float uTime;
      uniform float uPixelRatio;
      void main() {
        vHaloColor = haloColor;
        vHaloVisible = step(0.001, haloSize);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        float pulse = 1.0 + 0.07 * sin(uTime * 0.002 + haloPhase);
        gl_PointSize = clamp(haloSize * pulse * uPixelRatio * (260.0 / max(1.0, -mvPosition.z)), 0.0, 72.0);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying vec3 vHaloColor;
      varying float vHaloVisible;
      void main() {
        if (vHaloVisible < 0.5) discard;
        vec2 p = gl_PointCoord - vec2(0.5);
        float distanceFromCenter = length(p);
        float alpha = smoothstep(0.5, 0.05, distanceFromCenter) * 0.32;
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(vHaloColor, alpha);
      }
    `,
  });
}

function makeLinkMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute vec3 color;
      attribute float lineOpacity;
      attribute float lineBirth;
      varying vec3 vLineColor;
      varying float vLineOpacity;
      varying float vLineBirth;
      void main() {
        vLineColor = color;
        vLineOpacity = lineOpacity;
        vLineBirth = lineBirth;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vLineColor;
      varying float vLineOpacity;
      varying float vLineBirth;
      uniform float uTime;
      void main() {
        float fade = clamp((uTime - vLineBirth) / 400.0, 0.0, 1.0);
        float alpha = vLineOpacity * fade * 0.82;
        if (alpha < 0.005) discard;
        gl_FragColor = vec4(vLineColor, alpha);
      }
    `,
  });
}

function buildGraph(data) {
  disposeGroup(nodeGroup); disposeGroup(linkGroup); disposeGroup(labelGroup); disposeGroup(ringGroup);
  // 重新构图一律清掉 pin / hover（pin 节点可能已不在新图里）
  pinnedId = null; hoveredId = null; selectedId = null; focusMode = null;
  $('#infoCard').classList.add('hidden');
  tooltip.style.display = 'none';
  nodeInstances = null; nodeLayerMeshes = []; hitboxInstances = null; haloPoints = null; linkSegments = null;
  nodeMap = new Map(); linkRecords = []; linkProps = new Map();
  nodeVisualsDirty = true; haloVisualsDirty = true; linkVisualsDirty = true; labelLodDirty = true;
  cachedFocus = null; focusDirty = true; lastStatsKey = '';

  const types = Object.assign({}, SAMPLE.types, data.types || {});
  const nodes = (data.nodes || []).map(n => ({
    id: String(n.id ?? n.name ?? ''),
    label: n.label ?? n.name ?? String(n.id),
    type: n.type ?? 'default',
    description: n.description ?? '',
    properties: n.properties ?? null,
  })).filter(n => n.id);
  const links = (data.links || []).map(l => ({
    a: typeof l.source === 'object' ? String(l.source.id ?? l.source.name) : String(l.source),
    b: typeof l.target === 'object' ? String(l.target.id ?? l.target.name) : String(l.target),
    props: l.properties || null,
  }));

  for (const n of nodes) {
    if (!nodeMap.has(n.id)) nodeMap.set(n.id, { ...n, depth: 0, children: [], parents: [], angle: 0, size: 1 });
  }
  for (const l of links) {
    const a = nodeMap.get(l.a), b = nodeMap.get(l.b);
    if (!a || !b || a === b) continue;
    a.children.push(l.b);
    b.parents.push(l.a);
    if (l.props) linkProps.set(l.a + '\x00' + l.b, l.props);
    linkRecords.push({ a, b, props: l.props || null, birth: 0, index: linkRecords.length });
  }

  // 1) depth 直接按 TYPE_DEPTHS 排，未知 type 放最后（fallback 槽位递增）
  let fallbackDepth = Object.keys(TYPE_DEPTHS).length;
  for (const n of nodeMap.values()) {
    n.depth = (n.type in TYPE_DEPTHS) ? TYPE_DEPTHS[n.type] : fallbackDepth++;
  }

  // 2) 同一层均匀分布角度（不再按 parent/child 拓扑递归）。
  //    让 Product / Ingredient / HealthTopic / Evidence
  //    各自成一个干净的水平环；层间关系由连线和 y 偏移串起来。
  const byDepth = new Map();
  for (const n of nodeMap.values()) {
    if (!byDepth.has(n.depth)) byDepth.set(n.depth, []);
    byDepth.get(n.depth).push(n);
  }
  // 稳定排序：先按 type 在 TYPE_DEPTHS 里的定义顺序，再按 label
  for (const [, group] of byDepth) {
    group.sort((a, b) => {
      const ai = Object.keys(TYPE_DEPTHS).indexOf(a.type);
      const bi = Object.keys(TYPE_DEPTHS).indexOf(b.type);
      if (ai !== bi) return ai - bi;
      return a.label.localeCompare(b.label);
    });
  }
  for (const [depth, group] of byDepth) {
    const n = group.length;
    group.forEach((node, i) => {
      node.angle = (i / n) * Math.PI * 2;
    });
  }

  // 3) 把同深度的所有节点拉到同一条环上；每层 y 用 -depth * spacing
  //    天然得到"自顶向下"的层叠。每层 ring 半径由 cfg.ringRadii[depth]
  //    独立控制(4 个滑块),便于调试成圆台 / frustum 形状。
  const maxDepth = Math.max(0, ...byDepth.keys());
  const ringRadii = new Map();
  for (const n of nodeMap.values()) {
    n.r = (cfg.ringRadii[n.depth] != null)
      ? cfg.ringRadii[n.depth]                        // 4 个滑块独立控制,无缩放系数
      : (n.depth + 0.7) * 8;                          // fallback:未知 depth 按 ~8/step 推算
    n.x = n.r * Math.cos(n.angle);
    n.z = n.r * Math.sin(n.angle);
    n.y = -n.depth * cfg.layerSpacing;
    n.size = LAYER_SIZES[n.depth] != null
      ? LAYER_SIZES[n.depth]
      : 0.9;
    ringRadii.set(n.depth, n.r);
  }

  for (let d = 0; d <= maxDepth; d++) {
    const R = ringRadii.get(d) || (d + 0.7) * 8;
    if (R < 0.5) continue;
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = i / 128 * Math.PI * 2;
      pts.push(new THREE.Vector3(R * Math.cos(a), -d * cfg.layerSpacing, R * Math.sin(a)));
    }
    const line = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x2c3a5e, transparent: true, opacity: 0.4 })
    );
    ringGroup.add(line);
  }

  const nodeGeometry = new THREE.SphereGeometry(1, 16, 12);
  const nodeRecords = [...nodeMap.values()];
  const extraLayerTypes = [...new Set(nodeRecords.map(n => n.type))]
    .filter(type => !NODE_LAYER_TYPES.includes(type)).sort();
  const layerTypes = [...NODE_LAYER_TYPES, ...extraLayerTypes];
  const nodesByLayer = new Map(layerTypes.map(type => [type, []]));
  for (const n of nodeRecords) nodesByLayer.get(n.type).push(n);
  for (const type of layerTypes) {
    const members = nodesByLayer.get(type);
    if (!members.length) continue;
    const nodeLayerMesh = new THREE.InstancedMesh(
      nodeGeometry,
      makeNodeLayerMaterial(type),
      members.length
    );
    nodeLayerMesh.name = `nodeInstances:${type}`;
    nodeLayerMesh.frustumCulled = false;
    nodeLayerMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    nodeLayerMesh.userData.nodeType = type;
    nodeLayerMesh.userData.instanceIds = [];
    nodeLayerMeshes.push(nodeLayerMesh);
    nodeGroup.add(nodeLayerMesh);
    members.forEach((n, nodeLayerIndex) => {
      n.nodeLayerMesh = nodeLayerMesh;
      n.nodeLayerIndex = nodeLayerIndex;
    });
  }
  // Keep the old reference for diagnostics/extensions; rendering and picking
  // always iterate all typed layer meshes below.
  nodeInstances = nodeLayerMeshes[0] || null;

  const hitboxGeometry = new THREE.SphereGeometry(1, 8, 6);
  const hitboxMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
  hitboxInstances = new THREE.InstancedMesh(hitboxGeometry, hitboxMaterial, nodeMap.size);
  hitboxInstances.name = 'hitboxInstances';
  hitboxInstances.frustumCulled = false;
  hitboxInstances.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  hitboxInstances.userData.instanceIds = [];
  nodeGroup.add(hitboxInstances);

  const haloPositions = new Float32Array(nodeMap.size * 3);
  const haloColors = new Float32Array(nodeMap.size * 3);
  const haloSizes = new Float32Array(nodeMap.size);
  const haloPhases = new Float32Array(nodeMap.size);
  const buildNow = performance.now();
  nodeRecords.forEach((n, index) => {
    const color = typeColor(n.type, types);
    n.position = new THREE.Vector3(n.x, n.y, n.z);
    n.baseSize = n.size;
    n.baseColor = color.clone();
    n.color = n.baseColor;
    n.renderScale = n.size;
    n.renderColor = color.clone();
    n.amountShare = 0;
    n.instanceIndex = index;
    n.instanceVisible = true;
    n.instanceFocused = false;
    n.instanceScale = NaN;
    n.instanceColor = new THREE.Color();
    n.hitboxScale = Math.max(n.size * 2.5, 1.4);
    n.birth = buildNow + n.depth * 90;
    n.nodeLayerMesh.userData.instanceIds[n.nodeLayerIndex] = n.id;
    hitboxInstances.userData.instanceIds[index] = n.id;
    haloPositions[index * 3] = n.x;
    haloPositions[index * 3 + 1] = n.y;
    haloPositions[index * 3 + 2] = n.z;
    haloColors[index * 3] = color.r;
    haloColors[index * 3 + 1] = color.g;
    haloColors[index * 3 + 2] = color.b;
    haloSizes[index] = n.size * 3.4;
    haloPhases[index] = n.depth * 0.9 + index * 0.017;
    syncNodeInstance(n, 0.0001, true, false, true);
  });

  const haloGeometry = new THREE.BufferGeometry();
  haloGeometry.setAttribute('position', new THREE.BufferAttribute(haloPositions, 3));
  haloGeometry.setAttribute('haloColor', new THREE.BufferAttribute(haloColors, 3));
  haloGeometry.setAttribute('haloSize', new THREE.BufferAttribute(haloSizes, 1));
  haloGeometry.setAttribute('haloPhase', new THREE.BufferAttribute(haloPhases, 1));
  haloPoints = new THREE.Points(haloGeometry, makeHaloMaterial());
  haloPoints.name = 'haloPoints';
  haloPoints.frustumCulled = false;
  nodeGroup.add(haloPoints);
  configureRenderQuality(nodeMap.size);

  const positions = new Float32Array(linkRecords.length * 6);
  const colors = new Float32Array(linkRecords.length * 6);
  const opacities = new Float32Array(linkRecords.length * 2);
  const births = new Float32Array(linkRecords.length * 2);
  linkRecords.forEach((link, index) => {
    const offset = index * 6;
    positions.set([link.a.x, link.a.y, link.a.z, link.b.x, link.b.y, link.b.z], offset);
    colors.set([link.a.baseColor.r, link.a.baseColor.g, link.a.baseColor.b,
      link.b.baseColor.r, link.b.baseColor.g, link.b.baseColor.b], offset);
    link.birth = buildNow + Math.max(link.a.depth, link.b.depth) * 90;
    opacities[index * 2] = 1;
    opacities[index * 2 + 1] = 1;
    births[index * 2] = link.birth;
    births[index * 2 + 1] = link.birth;
  });
  const linkGeometry = new THREE.BufferGeometry();
  linkGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  linkGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  linkGeometry.setAttribute('lineOpacity', new THREE.BufferAttribute(opacities, 1));
  linkGeometry.setAttribute('lineBirth', new THREE.BufferAttribute(births, 1));
  linkSegments = new THREE.LineSegments(linkGeometry, makeLinkMaterial());
  linkSegments.name = 'linkSegments';
  linkSegments.frustumCulled = false;
  linkGroup.add(linkSegments);
  syncNodeBuffers();

  {
    const maxD = nodeMap.size ? Math.max(0, ...nodeMap.values().map(n => n.depth)) : 0;
    const typeSet = new Set([...nodeMap.values()].map(n => n.type));
    $('#stats').textContent = `${nodeMap.size} 节点 · ${linkRecords.length} 条关系 · ${typeSet.size} 种类型 · ${maxD + 1} 层`;
  }
}

function disposeNodeLabel(n) {
  if (!n.labelSprite) return;
  labelGroup.remove(n.labelSprite);
  const material = n.labelSprite.material;
  if (material && material.map) material.map.dispose();
  if (material) material.dispose();
  n.labelSprite = null;
}

function ensureNodeLabel(n) {
  if (n.labelSprite) return n.labelSprite;
  const label = makeLabelSprite(n.label, '#' + n.renderColor.getHexString());
  label.position.set(n.x, n.y + n.renderScale * 2.15, n.z);
  n.labelSprite = label;
  n.labelAspect = label.scale.x / label.scale.y;
  labelGroup.add(label);
  return label;
}

function syncLabelLOD(force = false, now = performance.now()) {
  if (!cfg.showLabels) {
    labelGroup.visible = false;
    cameraDirty = false;
    labelLodDirty = false;
    return;
  }
  if (!force && !labelLodDirty && (!cameraDirty || now - lastLabelLodAt < LABEL_LOD_INTERVAL_MS)) return;
  labelGroup.visible = true;
  const focus = computeFocus();
  const reachable = focus ? focus.reachable : null;
  const priorityIds = new Set([selectedId, hoveredId, pinnedId].filter(Boolean));
  for (const n of searchState.matches.slice(0, 12)) priorityIds.add(n.id);
  let candidates;
  if (nodeMap.size <= LABEL_LOD_THRESHOLD) {
    candidates = [...nodeMap.values()];
  } else {
    candidates = [...nodeMap.values()]
      .filter(n => !reachable || reachable.has(n.id))
      .sort((a, b) => {
        const aPriority = priorityIds.has(a.id) ? 1 : 0;
        const bPriority = priorityIds.has(b.id) ? 1 : 0;
        if (aPriority !== bPriority) return bPriority - aPriority;
        return camera.position.distanceTo(a.position) - camera.position.distanceTo(b.position);
      })
      .slice(0, MAX_VISIBLE_LABELS);
  }
  const candidateIds = new Set(candidates.map(n => n.id));
  for (const n of nodeMap.values()) {
    const visible = candidateIds.has(n.id) && (!reachable || reachable.has(n.id)) && !hiddenTypes.has(n.type);
    if (!visible) {
      if (nodeMap.size > LABEL_LOD_THRESHOLD || hiddenTypes.has(n.type)) disposeNodeLabel(n);
      else if (n.labelSprite) n.labelSprite.visible = false;
      continue;
    }
    const label = ensureNodeLabel(n);
    label.visible = true;
    label.position.set(n.x, n.y + n.renderScale * 2.15, n.z);
    const dist = camera.position.distanceTo(n.position);
    const worldH = (2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))) /
      Math.max(renderer.domElement.clientHeight, 1) * 26;
    label.scale.set(worldH * n.labelAspect, worldH, 1);
  }
  labelLodDirty = false;
  cameraDirty = false;
  lastLabelLodAt = now;
}

// --- Search: live filter nodes by label + type ---
function performSearch(query) {
  searchState.query = query.trim().toLowerCase();
  const types = Object.assign({}, SAMPLE.types, currentData?.types || {});
  searchState.matches = [...nodeMap.values()]
    .filter(n => {
      const matchesText = !searchState.query || n.label.toLowerCase().includes(searchState.query);
      const matchesType = n.type === searchState.typeFilter;
      return matchesText && matchesType;
    })
    .sort((a, b) => a.label.localeCompare(b.label))
    .slice(0, 50);
  labelLodDirty = true;
  renderSearchResults(searchState.matches, types);
}

// 计算当前 focus：无论点击哪一层节点，都只显示其祖先链 + 子孙链。
// 祖先 = 沿 parents 向上遍历（不横向扩散到兄弟节点）；
// 子孙 = 沿 children 向下遍历（不横向扩散到兄弟节点）。
// hover 不参与高亮决策（只显示 tooltip），Esc / 空白 click 稳定复位。
function computeFocus() {
  if (!focusDirty) return cachedFocus;
  focusDirty = false;
  if (!pinnedId || !nodeMap.has(pinnedId)) {
    cachedFocus = null;
    return cachedFocus;
  }
  const id = pinnedId;
  const n = nodeMap.get(id);
  const relevant = new Set([id]);

  // 祖先：沿 parents 向上 BFS（不沿 children 横向扩散）。
  let queue = [...n.parents];
  while (queue.length) {
    const cur = queue.shift();
    if (relevant.has(cur) || !nodeMap.has(cur)) continue;
    relevant.add(cur);
    for (const p of nodeMap.get(cur).parents) queue.push(p);
  }
  // 子孙：沿 children 向下 BFS（不沿 parents 横向扩散）。
  queue = [...n.children];
  while (queue.length) {
    const cur = queue.shift();
    if (relevant.has(cur) || !nodeMap.has(cur)) continue;
    relevant.add(cur);
    for (const c of nodeMap.get(cur).children) queue.push(c);
  }
  cachedFocus = { id, n, reachable: relevant, mode: 'lineage' };
  return cachedFocus;
}

 renderEvidenceExtras(n);

// 配方（Product）信息卡专属区块：展示 product_type + 所有成分节点名称与含量。
// 含量(amount)取自 Product→Ingredient 的「声明成分」关系属性；无含量则显示「—」。
// 有含量的成分排在前面，再按名称排序，方便快速阅读剂量信息。
function renderProductExtras(n) {
  const ptEl = $('#infoProductType');
  const ingEl = $('#infoIngredients');
  const t = String(n.type).toLowerCase();
  if (t !== 'product') {
    ptEl.style.display = 'none';
    ingEl.style.display = 'none';
    return;
  }
  // 产品类型（product_type）
  const ptype = n.properties && n.properties.product_type;
  if (ptype) {
    ptEl.innerHTML = '<span class="pt-key">产品类型：</span>' + escapeHtml(String(ptype));
    ptEl.style.display = 'block';
  } else {
    ptEl.style.display = 'none';
  }
  // 成分子节点（去重）：名称 + 含量
  const seen = new Set();
  const ings = n.children
    .map(id => nodeMap.get(id))
    .filter(c => c && String(c.type).toLowerCase() === 'ingredient' && !seen.has(c.id) && seen.add(c.id));
  ings.sort((a, b) => {
    const aa = amountOf(n.id, a.id) ? 0 : 1;
    const bb = amountOf(n.id, b.id) ? 0 : 1;
    if (aa !== bb) return aa - bb;
    return a.label.localeCompare(b.label, 'zh');
  });
  ingEl.innerHTML = '';
  if (!ings.length) { ingEl.style.display = 'none'; return; }
  const title = document.createElement('div');
  title.className = 'ing-title';
  title.textContent = `成分（${ings.length}）`;
  ingEl.appendChild(title);
  const list = document.createElement('div');
  list.className = 'ing-list';
  for (const c of ings) {
    const row = document.createElement('div');
    row.className = 'ing-row';
    const name = document.createElement('span');
    name.className = 'ing-name';
    name.textContent = c.label;
    name.style.color = '#' + c.renderColor.getHexString();
    const amt = amountOf(n.id, c.id);
    const amtEl = document.createElement('span');
    amtEl.className = 'ing-amt' + (amt ? '' : ' none');
    amtEl.textContent = amt || '—';
    row.appendChild(name);
    row.appendChild(amtEl);
    list.appendChild(row);
  }
  ingEl.appendChild(list);
  ingEl.style.display = 'block';
}

// amountOf 返回 Product→Ingredient 边上的含量(amount)字符串（去除残留的前导
// "=" 与空白），无含量时返回空串。源数据里部分 amount 形如 "=20毫克"，清洗后更整洁。
function amountOf(productId, ingredientId) {
  const p = linkProps.get(productId + '\x00' + ingredientId);
  if (!p || p.amount == null) return '';
  return String(p.amount).replace(/^[=\s]+/, '').trim();
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// fetchNodeDetail queries the backend for a single node's properties
// (description etc.) by elementId. Only updates the DOM if the user is

// 证据（Evidence）信息卡专属区块：展示 摘要 / 结论 / 证据等级 / 证据来源。
// 摘要可能上千字，用 max-height + 纵向滚动条；鼠标 hover 到摘要区时接管
// 滚轮（暂停 OrbitControls 缩放），离开后恢复相机缩放。
function renderEvidenceExtras(n) {
  const absEl = $('#infoAbstract');
  const evEl = $('#infoEvidence');
  if (String(n.type).toLowerCase() !== 'evidence') {
    absEl.style.display = 'none';
    evEl.style.display = 'none';
    return;
  }
  const props = n.properties || {};
  // 摘要（summary，旧数据兜底 abstract_excerpt）：可滚动区块。
  absEl.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'abs-title';
  title.textContent = '摘要';
  absEl.appendChild(title);
  const body = document.createElement('div');
  body.className = 'abs-body';
  const excerpt = props.summary || props.abstract_excerpt;
  if (excerpt) {
    body.textContent = String(excerpt);
  } else {
    const empty = document.createElement('span');
    empty.className = 'abs-empty';
    empty.textContent = '暂无摘要';
    body.appendChild(empty);
  }
  absEl.appendChild(body);
  absEl.style.display = 'block';
  // hover 摘要区：暂停相机滚轮缩放，交由文本滚动；离开后恢复。
  body.addEventListener('mouseenter', () => { controls.enableZoom = false; });
  body.addEventListener('mouseleave', () => { controls.enableZoom = true; });
  // 兜底：阻止滚轮事件冒泡到画布（不同 OrbitControls 版本监听位置不同）。
  body.addEventListener('wheel', e => e.stopPropagation(), { passive: true });

  // 结论（conclusion）+ 证据等级（evidence_level）+ 证据来源（source_url）。
  evEl.innerHTML = '';
  const evTitle = document.createElement('div');
  evTitle.className = 'ev-title';
  evTitle.textContent = '结论';
  evEl.appendChild(evTitle);
  const conclusion = props.conclusion || props.direction_hint;
  const conclMeta = conclusionMeta(conclusion);
  const conclRow = document.createElement('div');
  conclRow.className = 'ev-row';
  const conclBadge = document.createElement('span');
  conclBadge.className = 'ev-badge ' + conclMeta.cls;
  conclBadge.textContent = conclMeta.label;
  conclRow.appendChild(conclBadge);
  evEl.appendChild(conclRow);

  const levelRow = document.createElement('div');
  levelRow.className = 'ev-row';
  const levelKey = document.createElement('span');
  levelKey.className = 'ev-key';
  levelKey.textContent = '证据等级';
  const levelVal = document.createElement('span');
  levelVal.className = 'ev-value';
  levelVal.textContent = props.evidence_level || '暂无';
  levelVal.classList.toggle('ev-empty', !props.evidence_level);
  levelRow.appendChild(levelKey);
  levelRow.appendChild(levelVal);
  evEl.appendChild(levelRow);

  const sourceRow = document.createElement('div');
  sourceRow.className = 'ev-row';
  const sourceKey = document.createElement('span');
  sourceKey.className = 'ev-key';
  sourceKey.textContent = '证据来源';
  const sourceVal = document.createElement('span');
  sourceVal.className = 'ev-value';
  const source = props.source_url || props.source;
  if (source) {
    const link = document.createElement('a');
    link.className = 'ev-source';
    link.href = String(source);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = String(source);
    link.addEventListener('click', e => e.stopPropagation());
    sourceVal.appendChild(link);
  } else {
    sourceVal.className += ' ev-empty';
    sourceVal.textContent = '暂无';
  }
  sourceRow.appendChild(sourceKey);
  sourceRow.appendChild(sourceVal);
  evEl.appendChild(sourceRow);
  evEl.style.display = 'block';
}

// conclusionMeta maps a conclusion / old direction_hint value to a display
// label and color class for the badge in the Evidence info card.
function conclusionMeta(v) {
  const s = String(v || '');
  if (s === '有益' || s === '轻微有益' || /有益|改善|(?<!无)有效|benefit/i.test(s)) return { label: s, cls: 'benefit' };
  if (s === '有害' || /危害|有害|无益|风险|harm/i.test(s)) return { label: s, cls: 'harm' };
  if (s === '无效' || /无明确|无明显|无效应|neutral/i.test(s)) return { label: s, cls: 'neutral' };
  if (s === 'mixed_or_not_assessed') return { label: '混合 / 未评估', cls: 'neutral' };
  return { label: s || '未标注', cls: 'neutral' };
}

async function fetchNodeDetail(id) {
  const descEl = $('#infoDesc');
  try {
    const resp = await fetch(withToken(NODE_DETAIL_URL + '?id=' + encodeURIComponent(id)));
    const body = await resp.json();
    if (selectedId !== id) return;
    if (body.code === 0 && body.data && body.data.description) {
      descEl.textContent = body.data.description;
    } else {
      descEl.innerHTML = '<span class="desc-error">暂无描述</span>';
    }
  } catch {
    if (selectedId !== id) return;
    descEl.innerHTML = '<span class="desc-error">描述加载失败</span>';
  }
}

function nodeIdFromIntersection(intersection) {
  const object = intersection.object;
  if ((nodeLayerMeshes.includes(object) || object === hitboxInstances) && Number.isInteger(intersection.instanceId)) {
    const id = object.userData.instanceIds[intersection.instanceId];
    const node = id ? nodeMap.get(id) : null;
    return node && node.instanceVisible ? id : null;
  }
  return object.visible && object.userData && object.userData.nodeId ? object.userData.nodeId : null;
}

function pickNodeId() {
  raycaster.setFromCamera(pointer, camera);
  // 优先命中主体实例，再回退到批量 hitbox，减小误触。
  // Three.js Raycaster.intersectObjects() 不检查 object.visible —— focus 模式下
  // 隐藏的节点 / hitbox 必须自己过滤掉，否则会"穿透点击"到 lineage 外的暗区。
  const meshHits = nodeLayerMeshes.length ? raycaster.intersectObjects(nodeLayerMeshes, false) : [];
  const meshHit = meshHits.find(intersection => nodeIdFromIntersection(intersection));
  if (meshHit) return nodeIdFromIntersection(meshHit);
  const hitboxHits = hitboxInstances ? raycaster.intersectObject(hitboxInstances, false) : [];
  const hitboxHit = hitboxHits.find(intersection => nodeIdFromIntersection(intersection));
  return hitboxHit ? nodeIdFromIntersection(hitboxHit) : null;
}

renderer.domElement.addEventListener('click', () => {
  // 点击节点才选中；点空白处不执行任何逻辑（复位改由「重置画面」按钮接管），
  // 同时关闭搜索结果下拉。
  const id = pickNodeId();
  if (id) selectNode(id);
  else hideSearchResults();
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') selectNode(null); });

const easeOutBack = t => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function syncLinkVisibility(focus, reachable) {
  if (!linkSegments || !linkVisualsDirty) return;
  const attribute = linkSegments.geometry.getAttribute('lineOpacity');
  for (const link of linkRecords) {
    const visible = !focus
      ? !hiddenTypes.has(link.a.type) && !hiddenTypes.has(link.b.type)
      : reachable.has(link.a.id) && reachable.has(link.b.id);
    const value = visible ? 1 : 0;
    attribute.array[link.index * 2] = value;
    attribute.array[link.index * 2 + 1] = value;
  }
  attribute.needsUpdate = true;
  linkVisualsDirty = false;
}

function updateGraphStats(focus) {
  const maxD = nodeMap.size ? Math.max(0, ...nodeMap.values().map(n => n.depth)) : 0;
  const typeSet = new Set([...nodeMap.values()].map(n => n.type));
  const focusKey = focus ? `${focus.id}:${focus.reachable.size}` : 'none';
  if (focusKey === lastStatsKey) return;
  lastStatsKey = focusKey;
  const lineage = focus ? ` · 谱系子图 ${focus.reachable.size} 节点` : '';
  $('#stats').textContent = `${nodeMap.size} 节点 · ${linkRecords.length} 条关系 · ${typeSet.size} 种类型 · ${maxD + 1} 层${lineage}`;
}

function updateNodeVisuals(now, focus, reachable) {
  for (const n of nodeMap.values()) {
    const age = (now - n.birth) / 500;
    const birthScale = age < 1 ? easeOutBack(Math.min(1, age)) : 1;
    const visible = (!focus || reachable.has(n.id)) && !hiddenTypes.has(n.type);
    const focused = Boolean(focus && n.id === focus.id);
    const scale = visible ? n.renderScale * birthScale * (focused ? 1.18 : 1) : 0.0001;
    syncNodeInstance(n, scale, visible, focused);
  }
  syncNodeBuffers();
  if (haloPoints) haloPoints.material.uniforms.uTime.value = now;
}

function maybeUpdateHover(now) {
  if (!pointerDirty && !cameraDirty && now - lastHoverPickAt < HOVER_PICK_INTERVAL_MS) return;
  if (now - lastHoverPickAt < HOVER_PICK_INTERVAL_MS && !pointerDirty) return;
  raycaster.setFromCamera(pointer, camera);
  const meshHits = nodeLayerMeshes.length ? raycaster.intersectObjects(nodeLayerMeshes, false) : [];
  const meshHit = meshHits.find(intersection => nodeIdFromIntersection(intersection));
  const hit = meshHit || (hitboxInstances ? raycaster.intersectObject(hitboxInstances, false)
    .find(intersection => nodeIdFromIntersection(intersection)) : null);
  setHover(hit ? nodeIdFromIntersection(hit) : null);
  pointerDirty = false;
  lastHoverPickAt = now;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 1.1);
    const e = easeInOutCubic(fly.t);
    camera.position.lerpVectors(fly.from, fly.to, e);
    controls.target.lerpVectors(fly.cFrom, fly.cTo, e);
    if (fly.t >= 1) fly = null;
    cameraDirty = true;
    pointerDirty = true;
  }
  controls.update();
  const focus = computeFocus();
  const reachable = focus ? focus.reachable : null;
  updateGraphStats(focus);
  updateNodeVisuals(now, focus, reachable);
  syncLinkVisibility(focus, reachable);
  if (linkSegments) linkSegments.material.uniforms.uTime.value = now;
  syncLabelLOD();
  maybeUpdateHover(now);
  renderer.render(scene, camera);
  if (now - lastDiagnosticsAt > 1000) {
    lastDiagnosticsAt = now;
    console.debug('[kg-viewer] render diagnostics', {
      nodes: nodeMap.size,
      links: linkRecords.length,
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      lines: renderer.info.render.lines,
    });
  }
});

// 非侵入式验证钩子：只暴露只读快照，方便本地性能回归和浏览器验收，
// 不参与渲染路径，也不改变用户界面。
window.__KG_VIEWER_DEBUG__ = {
  snapshot() {
    return {
      nodeCount: nodeMap.size,
      linkCount: linkRecords.length,
      batched: Boolean(nodeLayerMeshes.length && hitboxInstances && linkSegments && haloPoints),
      nodeLayerCount: nodeLayerMeshes.length,
      nodeLayerTypes: nodeLayerMeshes.map(mesh => mesh.userData.nodeType),
      nodeLayerMaterialColors: nodeLayerMeshes.map(mesh => mesh.material.userData.legendColor || null),
      labelCount: [...nodeMap.values()].filter(n => n.labelSprite && n.labelSprite.visible).length,
      selectedId,
      focusedId: pinnedId,
      renderer: {
        calls: renderer.info.render.calls,
        triangles: renderer.info.render.triangles,
        lines: renderer.info.render.lines,
        geometries: renderer.info.memory.geometries,
      },
    };
  },
  node(id) {
    const n = nodeMap.get(id);
    if (!n) return null;
    return {
      id: n.id,
      type: n.type,
      amountShare: n.amountShare,
      scale: n.renderScale,
      color: n.renderColor.getHexString(),
    };
  },
  load(data) {
    loadJSON(JSON.stringify(data));
  },
};

function loadJSON(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.nodes) || !Array.isArray(data.links)) throw new Error('bad format');
    currentData = data;
    pinnedId = null; focusMode = null; hoveredId = null;  // 切图必清高亮
    $('#infoCard').classList.add('hidden');
    buildGraph(data);
   renderLegend(data);
    renderSearchTypeFilter(data);
 } catch (err) {
    alert('JSON 格式不正确：需要 { nodes: [{ id, label, type }], links: [{ source, target }] }');
  }
}

$('#toggleRotate').addEventListener('change', e => { controls.autoRotate = e.target.checked; cameraDirty = true; pointerDirty = true; });
$('#toggleLabels').addEventListener('change', e => {
  cfg.showLabels = e.target.checked;
  labelLodDirty = true;
  cameraDirty = true;
  syncLabelLOD(true);
});
// 调试滑块:每次改动都在控制台打印当前值,方便用户复制新默认值
function logConfigChange(key, value, extra) {
  const tail = extra ? ' ' + extra : '';
  console.log('[kg-viewer] ' + key + ' =', value, tail);
}

$('#layerSpacing').addEventListener('input', e => {
  cfg.layerSpacing = +e.target.value;
  $('#layerSpacingVal').textContent = cfg.layerSpacing.toFixed(1);
  logConfigChange('layerSpacing', cfg.layerSpacing);
  if (currentData) buildGraph(currentData);
});

// 4 层环半径独立滑块 — 调试圆台 / frustum 形状
const RING_RADIUS_LABELS = ['Product 配方', 'Ingredient 成分', 'Evidence 循证', 'HealthTopic 结局'];
function bindRingRadiusSlider(depth) {
  $('#ringRadius' + depth).addEventListener('input', e => {
    cfg.ringRadii[depth] = +e.target.value;
    $('#ringRadius' + depth + 'Val').textContent = cfg.ringRadii[depth].toFixed(1);
    logConfigChange('ringRadius' + depth + ' (' + RING_RADIUS_LABELS[depth] + ')', cfg.ringRadii[depth]);
    if (currentData) buildGraph(currentData);
  });
}
bindRingRadiusSlider(0);
bindRingRadiusSlider(1);
bindRingRadiusSlider(2);
bindRingRadiusSlider(3);

$('#graphOffsetY').addEventListener('input', e => {
  cfg.graphOffsetY = +e.target.value;
  $('#graphOffsetYVal').textContent = cfg.graphOffsetY.toFixed(1);
  applyGraphOffsetY(cfg.graphOffsetY);
  logConfigChange('graphOffsetY', cfg.graphOffsetY);
});

$('#cameraRadius').addEventListener('input', e => {
  const r = +e.target.value;
  $('#cameraRadiusVal').textContent = r;
  // 保持当前视角方向不变,只改相机到 target 的距离
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
  dir.normalize();
  // 限制在 OrbitControls 的 minDistance / maxDistance 之内
  const clamped = Math.max(controls.minDistance, Math.min(controls.maxDistance, r));
  camera.position.copy(controls.target).add(dir.multiplyScalar(clamped));
  cameraDirty = true;
  pointerDirty = true;
  if (clamped !== r) {
    e.target.value = clamped;
    $('#cameraRadiusVal').textContent = clamped;
  }
  logConfigChange('cameraRadius', clamped, '(pos=' + camera.position.toArray().map(n => +n.toFixed(2)).join(',') + ')');
});
$('#resetView').addEventListener('click', () => {
  fly = { t: 0, from: camera.position.clone(), to: INIT_POS.clone(), cFrom: controls.target.clone(), cTo: INIT_TARGET.clone() };
  // 回到默认布局:整图 Y 偏移 + 视野距离
  cfg.graphOffsetY = GRAPH_OFFSET_Y_DEFAULT;
  $('#graphOffsetY').value = GRAPH_OFFSET_Y_DEFAULT;
  $('#graphOffsetYVal').textContent = GRAPH_OFFSET_Y_DEFAULT.toFixed(1);
  applyGraphOffsetY(GRAPH_OFFSET_Y_DEFAULT);
  cameraDirty = true;
  pointerDirty = true;
  $('#cameraRadius').value = INIT_CAMERA_RADIUS;
  $('#cameraRadiusVal').textContent = String(INIT_CAMERA_RADIUS);
});
$('#resetScene').addEventListener('click', () => {
  // 接管原"点击空白处"的复位逻辑：清 pin/focus/hover + 关闭 info card
  selectNode(null);
});

// dev 开关:?dev=1 显示布局调试滑块,或运行中按 D 键切换(在输入框内不响应)
const devControls = document.getElementById('devControls');
function setDevVisible(visible) { devControls.classList.toggle('visible', visible); }
setDevVisible(new URLSearchParams(location.search).get('dev') === '1');
window.addEventListener('keydown', e => {
  if (e.key !== 'd' && e.key !== 'D') return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  setDevVisible(!devControls.classList.contains('visible'));
});
$('#searchInput').addEventListener('input', e => { performSearch(e.target.value); updateClearButton(); });
$('#searchTypeFilter').addEventListener('change', e => { searchState.typeFilter = e.target.value; performSearch($('#searchInput').value); });

// 搜索结果下拉：仅在用户聚焦到 searchPanel 内时显示，移出（包括点 3D 画布空白处）即隐藏
document.addEventListener('focusin', e => {
  const t = e.target;
  if (t && t.closest && t.closest('#searchPanel')) {
    // 聚焦到 #searchInput / #searchTypeFilter / 清除按钮 / 搜索结果项：渲染并显示
    showSearchResults();
  } else if (t && t.matches && t.matches('input, select, textarea, button')) {
    // 聚焦到搜索面板以外的输入控件：隐藏
    hideSearchResults();
  }
});
// 3D 画布 / 其它非 searchPanel 区域的点击：隐藏（canvas 不可 focus，需要靠 pointer 事件兜底）
document.addEventListener('pointerdown', e => {
  if (e.target && e.target.closest && e.target.closest('#searchPanel')) return;
  // 点击 searchResult / searchClear 等子元素时其自身的 click 已处理；这里统一兜底隐藏
  hideSearchResults();
}, true);
function updateClearButton() {
  $('#searchClear').style.display = ($('#searchInput').value || selectedId) ? 'flex' : 'none';
}
$('#searchClear').addEventListener('click', () => {
  $('#searchInput').value = '';
  performSearch('');
  selectNode(null);
  hideSearchResults();
  updateClearButton();
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = [...(e.dataTransfer?.files || [])].find(x => x.name.endsWith('.json') || x.type.includes('json'));
  if (f) f.text().then(loadJSON);
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  configureRenderQuality(nodeMap.size);
  cameraDirty = true;
  pointerDirty = true;
  labelLodDirty = true;
});

const qParams = new URLSearchParams(location.search);
const statusEl = $('#status');
function showStatus(msg, color) {
  statusEl.textContent = msg;
  statusEl.style.color = color || '#e6ecff';
  statusEl.style.display = 'block';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { statusEl.style.display = 'none'; }, 9000);
}

const urlToken = qParams.get('token') || '';
function withToken(url) {
  if (!urlToken) return url;
  return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(urlToken);
}

const API_BASE = (qParams.get('api') || '').replace(/\/+$/, '');
const API_URL = API_BASE + '/v1/graph/kg';
const NODE_DETAIL_URL = API_BASE + '/v1/node/detail';

async function loadFromAPI() {
  showStatus('正在从后端加载图谱…', '#4ecdc4');
  try {
    const resp = await fetch(withToken(API_URL), { headers: { Accept: 'application/json' } });
    let body = null;
    try { body = await resp.json(); } catch { /* keep null */ }
    const data = body && body.code === 0 ? body.data : null;
    if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.links)) {
      throw new Error((body && body.msg) || `后端返回异常（HTTP ${resp.status}）`);
    }
   currentData = data;
   buildGraph(data);
   renderLegend(data);
    renderSearchTypeFilter(data);
   showStatus(`已从后端加载 ${data.nodes.length} 节点 / ${data.links.length} 关系`, '#7ae0c3');
 } catch (err) {
   showStatus(`后端加载失败（${err.message}），展示内置示例数据`, '#ff9f6b');
   currentData = SAMPLE;
   buildGraph(SAMPLE);
   renderLegend(SAMPLE);
    renderSearchTypeFilter(SAMPLE);
 }
}
const dataParam = qParams.get('data');
if (dataParam) {
  fetch(withToken(dataParam)).then(r => r.text()).then(loadJSON).catch(() => {});
} else {
  loadFromAPI();
}
</script>
