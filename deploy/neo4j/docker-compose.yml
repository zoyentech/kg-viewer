# 本地 Neo4j（知识图谱数据源，供 GET /v1/graph/kg + /kg-viewer 使用）。
#
# 用法（仓库根目录）：
#   make neo4j-up       启动容器
#   make neo4j-seed     灌入示例营养知识图谱（幂等）
#   make neo4j-down     停止容器
# 浏览器管理台：http://localhost:7474 （neo4j / healthdinner123）
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: healthdinner-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt (driver)
    environment:
      NEO4J_AUTH: neo4j/healthdinner123
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j_data:/data
      - ./seeds:/seeds:ro
volumes:
  neo4j_data:
