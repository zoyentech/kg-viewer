# M3 Neo4j Community v2 bilingual instance.
# Install as /opt/homebrew/etc/neo4j-v2/neo4j.conf.
server.default_listen_address=0.0.0.0
server.default_advertised_address=192.168.31.201
server.bolt.enabled=true
server.bolt.listen_address=:7689
server.bolt.advertised_address=192.168.31.201:7689
server.http.enabled=true
server.http.listen_address=:7476
server.http.advertised_address=192.168.31.201:7476
server.https.enabled=false
server.directories.data=/opt/homebrew/var/neo4j-v2/data
server.directories.logs=/opt/homebrew/var/neo4j-v2/logs
server.directories.import=/opt/homebrew/var/neo4j-v2/import
server.directories.run=/opt/homebrew/var/neo4j-v2/run
server.memory.heap.initial_size=4g
server.memory.heap.max_size=4g
server.memory.pagecache.size=4g
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-XX:+AlwaysPreTouch
server.jvm.additional=-Djava.awt.headless=true
